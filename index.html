<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT 인프라 통합 학습노트</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#fff; --bg2:#f4f6f8; --ink:#0f172a; --mute:#64748b; --hair:#e2e8f0; --acc:#0b63ce; --acc-soft:#eef4fc; }
:root[data-theme="dark"] { --bg:#121821; --bg2:#18202b; --ink:#e8edf4; --mute:#94a3b8; --hair:#263140; --acc:#5aa2f5; --acc-soft:#16263a; }
* { box-sizing:border-box; }
html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif; }
body { display:flex; flex-direction:column; }
.topbar { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--hair); padding:6px 10px; display:flex; align-items:center; gap:8px; }
.tabs { display:flex; gap:5px; overflow-x:auto; flex:1; scrollbar-width:none; padding:2px 12px 2px 0; -webkit-mask-image:linear-gradient(to right,#000 92%,transparent 100%); mask-image:linear-gradient(to right,#000 92%,transparent 100%); }
.tabs::-webkit-scrollbar { display:none; }
.tab { border:1px solid var(--hair); background:var(--bg2); color:var(--mute); padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; line-height:1.4; }
.tab.active { background:var(--acc-soft); color:var(--acc); border-color:var(--acc); }
.theme-btn { border:1px solid var(--hair); background:var(--bg2); color:var(--ink); padding:4px 9px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0; }
iframe { flex:1; width:100%; border:0; background:var(--bg); }
</style>
</head>
<body>
<div class="topbar">
  <div class="tabs" id="tabs"></div>
  <button class="theme-btn" id="themeBtn" type="button">다크</button>
</div>
<iframe id="viewer" title="학습노트 본문"></iframe>
<button id="tocFab" type="button" style="position:fixed;right:14px;bottom:18px;z-index:20;border:1px solid var(--hair);background:var(--acc);color:#fff;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.18);cursor:pointer;">목차 ↑</button>
<script>
(function(){
  var subjects = [
    ["linux.html","Linux"],["shell.html","Shell"],["vsftpd.html","vsFTPd"],
    ["httpd.html","Apache"],["nginx.html","Nginx"],["was.html","WAS"],
    ["fastapi.html","FastAPI"],["mysql.html","MySQL"],["postgresql.html","PostgreSQL"],["vectordb.html","VectorDB"],
    ["docker.html","Docker"],["python.html","Python"],["spark.html","Spark"],["pyspark.html","PySpark"],["aws.html","AWS"]
  ];
  var tabsEl = document.getElementById("tabs"), tocFab = document.getElementById("tocFab"), viewer = document.getElementById("viewer"), btn = document.getElementById("themeBtn");
  var r = document.documentElement;
  function curTheme(){ var t=r.getAttribute("data-theme"); if(t) return t; return matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"; }
  function applyTheme(t){
    r.setAttribute("data-theme",t); btn.textContent=t==="dark"?"라이트":"다크";
    try{ if(viewer.contentDocument) viewer.contentDocument.documentElement.setAttribute("data-theme",t); }catch(e){}
  }
  try{ var st=localStorage.getItem("note-theme"); if(st) r.setAttribute("data-theme",st); }catch(e){}
  applyTheme(curTheme());
  btn.addEventListener("click",function(){ var n=curTheme()==="dark"?"light":"dark"; applyTheme(n); try{localStorage.setItem("note-theme",n);}catch(e){} });

  var mobileCSS = [
    ".deck{display:none !important;}",
    ".core-strip{display:none !important;}",
    ".core-strip.is-open{display:grid !important;gap:10px !important;margin-top:12px !important;}",
    ".core-toggle{display:inline-flex;align-items:center;gap:4px;margin:8px 0 4px;padding:6px 12px;border-radius:999px;border:1px solid var(--hair);background:var(--paper-alt);color:var(--ink2);font-size:12.5px;font-weight:600;cursor:pointer;}",
    ".core-bullets{margin:4px 0 0 !important;padding-left:16px !important;}",
    ".core-bullets li{font-size:13px !important;line-height:1.55 !important;margin-bottom:5px !important;color:var(--ink2) !important;}",
    "p,li{word-break:keep-all !important;overflow-wrap:break-word !important;line-height:1.68 !important;}",
    "pre{white-space:pre !important;overflow-x:auto !important;word-break:normal !important;overflow-wrap:normal !important;}",
    "@media (min-width:1081px){",
    "  .side nav{max-height:calc(100vh - 48px) !important;overflow-y:auto !important;padding-right:6px !important;}",
    "  .side li{font-size:12.6px !important;line-height:1.34 !important;}",
    "  .side a{padding:4px 0 4px 11px !important;}",
    "  .page{max-width:1560px !important;margin:0 auto !important;padding:28px 40px 80px !important;}",
    "  header{padding-bottom:0 !important;margin-bottom:0 !important;}",
    "  h1{font-size:28px !important;line-height:1.3 !important;margin:0 0 10px !important;}",
    "  h2{font-size:20px !important;margin:24px 0 10px !important;line-height:1.35 !important;}",
    "  h3{font-size:16px !important;margin:18px 0 8px !important;}",
    "  .sec,.band{margin-top:48px !important;}",
    "  hr{margin:24px 0 28px !important;}",
    "}",
    "@media (min-width:761px) and (max-width:1080px){",
    "  .page{padding:24px 28px 80px !important;}",
    "  header{padding-bottom:0 !important;margin-bottom:0 !important;}",
    "  .toc{margin:14px 0 0 !important;padding:14px 16px !important;border-radius:10px !important;}",
    "}",
    "@media (max-width:760px){",
    "  html{font-size:14px !important;}",
    "  .page{padding:16px 14px 48px !important;}",
    "  h1{font-size:22px !important;line-height:1.3 !important;margin:0 0 8px !important;}",
    "  h2{font-size:17.5px !important;margin:24px 0 8px !important;line-height:1.35 !important;}",
    "  h3{font-size:15px !important;margin:18px 0 6px !important;}",
    "  p,li{font-size:13.8px !important;line-height:1.62 !important;}",
    "  li{margin-bottom:6px !important;}",
    "  .sec,.band{margin-top:32px !important;}",
    "  .band{padding:18px 14px 12px !important;}",
    "  .toc{margin:12px 0 0 !important;padding:10px 14px !important;border-radius:10px !important;}",
    "  .toc a{padding:4px 0 !important;border-bottom:1px solid var(--hair-soft);font-size:12.8px !important;line-height:1.38 !important;}",
    "  .toc a:last-child{border-bottom:0;}",
    "  .core-strip>div{padding:12px 14px !important;}",
    "  .core-metric{font-size:15px !important;margin-bottom:4px !important;}",
    "  .core-desc{font-size:12.5px !important;line-height:1.55 !important;}",
    "  .core-bullets li{font-size:12.5px !important;line-height:1.5 !important;}",
    "  pre{font-size:11.8px !important;padding:10px 12px !important;line-height:1.5 !important;}",
    "  .table-wrap{overflow-x:visible !important;border:0 !important;margin:10px 0 !important;}",
    "  table{display:block !important;min-width:0 !important;width:100% !important;border:0 !important;}",
    "  thead{display:none !important;}",
    "  tbody{display:block !important;width:100% !important;}",
    "  tr{display:block !important;border:1px solid var(--hair) !important;border-radius:8px !important;padding:9px 11px !important;margin-bottom:8px !important;background:var(--paper) !important;}",
    "  td{display:block !important;border:0 !important;padding:2px 0 !important;width:auto !important;word-break:keep-all !important;overflow-wrap:break-word !important;}",
    "  td:first-child{font-weight:700 !important;color:var(--ink) !important;margin-bottom:3px !important;font-size:13px !important;}",
    "  td+td{font-size:12.8px !important;color:var(--ink2) !important;line-height:1.55 !important;}",
    "  td.nowrap,th.nowrap{white-space:normal !important;}",
    "  code{word-break:keep-all !important;overflow-wrap:break-word !important;}",
    "  .note-fix,.note-verify{margin:14px 0 18px !important;padding:12px 14px 4px !important;}",
    "  .note-fix p,.note-verify p{font-size:13.2px !important;line-height:1.6 !important;padding:6px 0 8px !important;}",
    "}"
  ].join("\n");

  function injectPolish(doc){
    if(!doc || !doc.head) return;
    if(!doc.getElementById("sn-mobile-polish")){
      var s=doc.createElement("style"); s.id="sn-mobile-polish"; s.textContent=mobileCSS;
      doc.head.appendChild(s);
    }
    doc.querySelectorAll(".core-desc").forEach(function(el){
      if(el.dataset.bulletized) return;
      el.dataset.bulletized="1";
      var raw=el.innerHTML;
      var parts=raw.split(/\(\d+(?:[~·,-]\d+)*장\)\.?\s*/);
      var tags=raw.match(/\(\d+(?:[~·,-]\d+)*장\)/g);
      if(tags && tags.length>=2){
        var ul=doc.createElement("ul"); ul.className="core-bullets";
        for(var i=0;i<tags.length;i++){
          var txt=(parts[i]||"").trim();
          if(!txt) continue;
          var li=doc.createElement("li");
          li.innerHTML=txt+" <b>"+tags[i]+"</b>";
          ul.appendChild(li);
        }
        if(parts[tags.length] && parts[tags.length].trim()){
          var li=doc.createElement("li"); li.innerHTML=parts[tags.length].trim(); ul.appendChild(li);
        }
        el.replaceWith(ul);
      }
    });
    var cs=doc.querySelector(".core-strip");
    if(cs && !doc.querySelector(".core-toggle")){
      var cb=doc.createElement("button"); cb.type="button"; cb.className="core-toggle"; cb.textContent="핵심 요약 3장 보기 ▾";
      cb.addEventListener("click",function(){
        var open=cs.classList.toggle("is-open");
        cb.textContent=open?"핵심 요약 접기 ▴":"핵심 요약 3장 보기 ▾";
      });
      cs.insertAdjacentElement("beforebegin", cb);
    }

  }

  function openPage(file){
    viewer.src = file;
    document.querySelectorAll(".tab").forEach(function(el){ el.classList.toggle("active", el.dataset.file===file); });
    try{ localStorage.setItem("sn-last-file", file); }catch(e){}
  }
  subjects.forEach(function(s){
    var b=document.createElement("button"); b.className="tab"; b.type="button"; b.textContent=s[1]; b.dataset.file=s[0];
    b.addEventListener("click",function(){ openPage(s[0]); });
    tabsEl.appendChild(b);
  });
  viewer.addEventListener("load", function(){
    applyTheme(curTheme());
    try{
      var doc = viewer.contentDocument;
      var ib = doc.getElementById("themeBtn");
      if(ib) ib.style.display="none";
      injectPolish(doc);
      var cur = (viewer.contentWindow.location.pathname.split("/").pop()) || "linux.html";
      document.querySelectorAll(".tab").forEach(function(el){
        var active = el.dataset.file===cur;
        el.classList.toggle("active", active);
        if(active) el.scrollIntoView({inline:"center",block:"nearest"});
      });
    }catch(e){}
  });
  var last="linux.html";
  try{ var lf=localStorage.getItem("sn-last-file"); if(lf && subjects.some(function(x){return x[0]===lf;})) last=lf; }catch(e){}
  tocFab.addEventListener("click",function(){ try{ var d=viewer.contentDocument; var t=d.querySelector(".toc")||d.body; t.scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){} });
  openPage(last);
})();
</script>
</body>
</html>
